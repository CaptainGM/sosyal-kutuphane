name: Canlı siteyi uyanık tut

# Render ücretsiz planda 15 dakika istek gelmezse siteyi uyutur ve ilk açılış yavaş olur.
# Bu iş akışı 5 dakikada bir siteye istek atarak uyumasını engeller.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Siteye istek at
        run: curl -fsS -m 90 --retry 3 --retry-delay 15 -o /dev/null https://sosyal-kutuphane-qr9i.onrender.com/index.html
