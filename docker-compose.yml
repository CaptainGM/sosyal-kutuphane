services:
  db:
    image: mongo:7
    volumes:
      - db_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://db:27017
      MONGO_DB: social_library
    ports:
      - "8000:8000"

volumes:
  db_data:
