<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Sosyal Kütüphane</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--color-accent-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--color-surface);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-container h1 {
            text-align: center;
            color: var(--color-text);
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-text);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--color-border);
            border-radius: 8px;
            font-size: 16px;
            background: var(--color-surface);
            color: var(--color-text);
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--color-accent-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--color-text-muted);
        }

        .login-footer a {
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            background: var(--color-danger);
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--color-accent);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>🎬 Sosyal Kütüphane</h1>

        <div class="error-message" id="errorMessage"></div>
        <div class="loading" id="loading">Giriş yapılıyor...</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">📧 E-Posta:</label>
                <input type="email" id="email" placeholder="ornek@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">🔐 Şifre:</label>
                <input type="password" id="password" placeholder="Şifrenizi girin" required>
            </div>

            <button type="submit" class="btn-login">Giriş Yap</button>
        </form>

        <div class="login-footer">
            Hesabınız yok mu? <a href="index.html">Kayıt Olun</a>
        </div>
    </div>

    <script src="js/escape-html.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const loadingDiv = document.getElementById('loading');

            errorDiv.style.display = 'none';
            loadingDiv.style.display = 'block';

            try {
                const response = await fetch('/api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {

                    loadingDiv.style.display = 'none';
                    errorDiv.textContent = '✅ Giriş başarılı!';
                    errorDiv.style.display = 'block';
                    errorDiv.style.background = '#28a745';

                    setTimeout(() => {
                        window.location.href = 'search.html';
                    }, 1000);
                } else {
                    loadingDiv.style.display = 'none';
                    errorDiv.textContent = '❌ ' + (data.message || 'E-posta veya şifre hatalı!');
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                loadingDiv.style.display = 'none';
                errorDiv.textContent = '❌ Bağlantı hatası: ' + error.message;
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>

</html>
