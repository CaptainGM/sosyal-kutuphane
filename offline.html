<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05060b">
    <title>Çevrimdışı - Sosyal Kütüphane</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
    <script src="js/motion.js"></script>
    <script>
        // Bu sayfa çevrimdışıyken servis çalışanından gelir; app.js yüklenmez, tema yalnızca burada uygulanır.
        try {
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.setAttribute('data-theme', savedTheme);
        } catch (e) { }
    </script>
    <style>
        .offline-shell {
            display: grid;
            min-height: 100vh;
            min-height: 100dvh;
            place-items: center;
            padding: 28px var(--gutter);
        }

        .offline-card {
            display: grid;
            justify-items: center;
            gap: 14px;
            width: min(480px, 100%);
            padding: clamp(28px, 6vw, 46px);
            text-align: center;
        }

        .offline-icon {
            display: grid;
            place-items: center;
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: rgba(var(--color-accent-rgb), 0.14);
            color: var(--color-accent);
        }

        .offline-icon svg {
            width: 34px;
            height: 34px;
        }

        .offline-title {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .offline-tip {
            color: var(--color-text-faint);
            font-size: 13.5px;
        }

        .offline-status {
            min-height: 1.3em;
            color: var(--color-success);
            font-size: 13.5px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main id="main" class="offline-shell">
        <section class="panel offline-card" aria-labelledby="offlineTitle">
            <div class="offline-icon"><svg class="ui-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h.01M8.5 16.4a5 5 0 0 1 7 0M5 12.86a10 10 0 0 1 5.17-2.7M19 12.86a10 10 0 0 0-2.17-1.6M2 8.82a15 15 0 0 1 4.17-2.65M22 8.82a15 15 0 0 0-11.29-3.76M2 2l20 20"/></svg></div>
            <h1 id="offlineTitle" class="offline-title">Çevrimdışısın</h1>
            <p class="page-sub" style="margin: 0;">İnternet bağlantısı bulunamadı. Bağlantı geri gelince bu sayfa kendiliğinden yenilenir.</p>
            <button type="button" class="btn btn-primary" id="retryBtn">Tekrar dene</button>
            <p class="offline-status" id="offlineStatus" role="status"></p>
            <p class="offline-tip">Daha önce açtığın bazı sayfalar çevrimdışıyken de görünebilir.</p>
        </section>
    </main>

    <script>
        document.getElementById('retryBtn').addEventListener('click', function () {
            var status = document.getElementById('offlineStatus');
            status.style.color = 'var(--color-text-muted)';
            status.textContent = navigator.onLine ? 'Yenileniyor...' : 'Hâlâ bağlantı yok.';
            if (navigator.onLine) location.reload();
        });
        window.addEventListener('online', function () {
            var status = document.getElementById('offlineStatus');
            status.style.color = 'var(--color-success)';
            status.textContent = 'Bağlantı geri geldi, yenileniyor...';
            setTimeout(function () { location.reload(); }, 600);
        });
    </script>
</body>

</html>
