    <style>
        /* Yeni çıkanlar sayfasına özel stiller: ay ay gruplanmış vizyon kartları. Ortak parçalar css/ui.css'te. */

        .month-block + .month-block {
            margin-top: 40px;
        }

        .month-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            font-size: clamp(20px, 2.4vw, 26px);
            font-weight: 800;
            letter-spacing: -0.025em;
            text-transform: capitalize;
        }

        .release-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 22px;
        }

        .release-card {
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            background: var(--glass-bg);
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .release-card:hover,
        .release-card:focus-within {
            transform: translateY(-6px);
            border-color: rgba(var(--color-accent-rgb), 0.5);
            box-shadow: var(--shadow-hover);
        }

        .release-poster {
            position: relative;
            display: block;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: var(--color-surface-2);
        }

        .release-poster img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .release-card:hover .release-poster img {
            transform: scale(1.04);
        }

        .release-noposter {
            display: grid;
            width: 100%;
            height: 100%;
            place-items: center;
            color: var(--color-text-faint);
        }

        .release-noposter svg {
            width: 44px;
            height: 44px;
        }

        .release-date {
            position: absolute;
            top: 12px;
            left: 12px;
            display: grid;
            justify-items: center;
            min-width: 52px;
            padding: 7px 10px 6px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 14px;
            background: rgba(5, 6, 11, 0.62);
            color: #ffffff;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            line-height: 1.05;
            text-align: center;
        }

        .release-date b {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .release-date span {
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .release-body {
            display: grid;
            flex: 1;
            align-content: start;
            gap: 10px;
            padding: 16px;
        }

        .release-title {
            font-size: 16px;
            font-weight: 800;
            line-height: 1.3;
        }

        .release-title a {
            color: inherit;
            text-decoration: none;
        }

        .release-title a:hover {
            color: var(--color-accent);
        }

        .release-title a:focus-visible {
            outline: none;
            text-decoration: underline;
        }

        .release-overview {
            display: -webkit-box;
            overflow: hidden;
            color: var(--color-text-muted);
            font-size: 13.5px;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .release-actions {
            margin-top: auto;
            padding-top: 4px;
        }

        .release-actions .btn,
        .release-actions .btn-glass {
            width: 100%;
            justify-content: center;
        }
    </style>
</head>

    <main id="main" class="page">
        <header class="page-head">
            <div>
                <span class="eyebrow"><span class="dot"></span>Vizyon takvimi · Türkiye</span>
                <h1 class="page-title">Yeni <span class="gradient-text">çıkanlar</span></h1>
                <p class="page-sub">Yakında vizyona girecek filmler. Hatırlatıcı kurarsan vizyon tarihi geldiğinde bildirim alırsın.</p>
            </div>
        </header>

        <p id="upcomingStatus" class="loading" role="status">Yükleniyor...</p>
        <div id="upcomingGrid"></div>

        <nav class="pagination" aria-label="Sayfalar">
            <button type="button" id="prevPage" disabled>Önceki</button>
            <span id="pageInfo" class="active" aria-live="polite"></span>
            <button type="button" id="nextPage" disabled>Sonraki</button>
        </nav>
    </main>

    <script src="js/escape-html.js"></script>
    <script src="js/app.js"></script>
    <script>
        const POSTER_BASE = 'https://image.tmdb.org/t/p/w342';
        let currentPage = 1;
        let totalPages = 1;
        let reminderIds = new Set();

        document.addEventListener('DOMContentLoaded', async () => {
            await app.initPromise;
            if (app.currentUser) await loadReminders();
            await loadPage(1);

            document.getElementById('prevPage').addEventListener('click', () => loadPage(currentPage - 1));
            document.getElementById('nextPage').addEventListener('click', () => loadPage(currentPage + 1));
            document.getElementById('upcomingGrid').addEventListener('click', (event) => {
                const button = event.target.closest('.upcoming-remind');
                if (button) toggleReminder(button);
            });
        });

        async function loadReminders() {
            try {
                const res = await fetch('/api/release-reminders.php', { credentials: 'include' });
                const data = await res.json();
                if (data.success) reminderIds = new Set(data.reminders.map(r => r.tmdb_id));
            } catch (error) {
                console.error('Hatırlatıcılar yüklenemedi:', error);
            }
        }

        async function loadPage(target) {
            const status = document.getElementById('upcomingStatus');
            const grid = document.getElementById('upcomingGrid');
            status.className = 'loading';
            status.textContent = 'Yükleniyor...';

            try {
                const res = await fetch(`/api/upcoming.php?page=${target}`, { credentials: 'include' });
                const data = await res.json();
                if (!data.success) {
                    status.className = 'error-message';
                    status.textContent = data.message || 'Liste alınamadı.';
                    grid.innerHTML = '';
                    updatePager(1, 1);
                    return;
                }

                currentPage = data.page;
                totalPages = data.total_pages || 1;
                if (data.items.length) {
                    status.className = 'visually-hidden';
                    status.textContent = `${data.items.length} yapım listelendi.`;
                } else {
                    status.className = 'empty';
                    status.textContent = 'Şu an listelenecek yapım yok.';
                }
                grid.innerHTML = renderMonths(data.items);
                updatePager(currentPage, totalPages);
                window.scrollTo({ top: 0, behavior: motionReduced() ? 'auto' : 'smooth' });
            } catch (error) {
                status.className = 'error-message';
                status.textContent = 'Bağlantı hatası: ' + error.message;
            }
        }

        function updatePager(page, pages) {
            document.getElementById('prevPage').disabled = page <= 1;
            document.getElementById('nextPage').disabled = page >= pages;
            document.getElementById('pageInfo').textContent = `${page} / ${pages}`;
        }

        function parseDay(value) {
            return value ? new Date(`${value}T00:00:00`) : null;
        }

        // Yapımlar vizyon ayına göre gruplanır; tarihi belirsizler en sona gider.
        function renderMonths(items) {
            const groups = new Map();
            items.forEach(item => {
                const date = parseDay(item.release_date);
                const key = date ? date.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' }) : 'Tarihi belirsiz';
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(item);
            });
            return [...groups].map(([month, rows]) => `
                <section class="month-block" aria-label="${app.escapeHtml(month)}">
                    <h2 class="month-title">${app.escapeHtml(month)} <span class="chip">${rows.length}</span></h2>
                    <div class="release-grid">${rows.map(renderCard).join('')}</div>
                </section>
            `).join('');
        }

        function countdown(date) {
            if (!date) return '';
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const days = Math.round((date - today) / 86400000);
            if (days < 0) return '<span class="chip chip--success">Vizyonda</span>';
            if (days === 0) return '<span class="chip chip--success">Bugün vizyonda</span>';
            if (days === 1) return '<span class="chip chip--accent">Yarın</span>';
            return `<span class="chip chip--accent">${days} gün sonra</span>`;
        }

        function renderCard(item) {
            const title = app.escapeHtml(item.title);
            const detailUrl = `detail.php?type=movie&id=${Number(item.tmdb_id)}`;
            const date = parseDay(item.release_date);
            const poster = item.poster_path
                ? `<img src="${POSTER_BASE}${app.escapeHtml(item.poster_path)}" alt="${title} afişi" loading="lazy">`
                : '<div class="release-noposter" aria-hidden="true"><svg class="ui-i" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 12h18M3 16h4M17 8h4M17 16h4"/></svg></div>';
            const badge = date
                ? `<div class="release-date" aria-hidden="true"><b>${date.getDate()}</b><span>${date.toLocaleDateString('tr-TR', { month: 'short' }).replace('.', '')}</span></div>`
                : '';
            const active = reminderIds.has(item.tmdb_id);
            const action = app.currentUser
                ? `<button type="button" class="btn ${active ? 'btn-secondary' : 'btn-primary'} upcoming-remind" data-id="${Number(item.tmdb_id)}" data-date="${app.escapeHtml(item.release_date || '')}" data-title="${title}" data-active="${active ? '1' : '0'}">${active ? 'Hatırlatıcı kuruldu' : 'Hatırlat'}</button>`
                : '<a class="btn-glass" href="index.html">Hatırlatıcı için giriş yap</a>';

            return `<article class="release-card">
                <a class="release-poster" href="${detailUrl}" tabindex="-1" aria-hidden="true">${poster}${badge}</a>
                <div class="release-body">
                    <div class="cluster cluster--tight">${countdown(date)}<span class="faint" style="font-size: 12.5px;">${app.escapeHtml(formatDate(item.release_date))}</span></div>
                    <h3 class="release-title"><a href="${detailUrl}">${title}</a></h3>
                    <p class="release-overview">${app.escapeHtml(item.overview || 'Özet henüz eklenmemiş.')}</p>
                    <div class="release-actions">${action}</div>
                </div>
            </article>`;
        }

        function formatDate(value) {
            if (!value) return 'Tarih belirsiz';
            return parseDay(value).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        async function toggleReminder(button) {
            const tmdbId = parseInt(button.dataset.id, 10);
            const wasActive = button.dataset.active === '1';
            button.disabled = true;

            try {
                const res = await fetch('/api/release-reminders.php', {
                    method: 'POST',
                    headers: app.authHeaders(),
                    credentials: 'include',
                    body: JSON.stringify({
                        action: wasActive ? 'remove' : 'add',
                        tmdb_id: tmdbId,
                        title: button.dataset.title,
                        release_date: button.dataset.date,
                    }),
                });
                const data = await res.json();
                if (!data.success) {
                    app.toast(data.message || 'Hatırlatıcı kaydedilemedi.', 'error');
                    return;
                }

                const nowActive = Boolean(data.active);
                button.dataset.active = nowActive ? '1' : '0';
                button.textContent = nowActive ? 'Hatırlatıcı kuruldu' : 'Hatırlat';
                button.classList.toggle('btn-primary', !nowActive);
                button.classList.toggle('btn-secondary', nowActive);
                app.toast(nowActive ? 'Vizyon tarihinde haber vereceğiz.' : 'Hatırlatıcı kaldırıldı.', 'success');
            } catch (error) {
                app.toast('Bağlantı hatası: ' + error.message, 'error');
            } finally {
                button.disabled = false;
            }
        }
    </script>
