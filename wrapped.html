<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>Yıllık Özet - Sosyal Kütüphane</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .wrapped-hero {
            background: var(--color-accent-gradient);
            color: white;
            padding: 50px 0 40px;
            text-align: center;
        }

        .wrapped-hero h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .wrapped-hero p {
            opacity: 0.9;
        }

        .year-select {
            margin-top: 18px;
            padding: 8px 14px;
            border-radius: var(--radius);
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .wrapped-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        .wrapped-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .wrapped-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 24px;
            text-align: center;
        }

        .wrapped-card .big-number {
            font-size: 40px;
            font-weight: 800;
            background: var(--color-accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .wrapped-card .label {
            color: var(--color-text-muted);
            font-size: 14px;
            margin-top: 6px;
        }

        .wrapped-highlight {
            background: var(--color-accent-gradient);
            color: white;
            border-radius: var(--radius-lg);
            padding: 28px;
            text-align: center;
            margin-bottom: 20px;
        }

        .wrapped-highlight .highlight-title {
            font-size: 24px;
            font-weight: 700;
            margin: 8px 0;
        }

        .wrapped-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-faint);
        }

        .wrapped-loading {
            text-align: center;
            padding: 60px;
            color: var(--color-accent);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="search.html" class="logo" style="display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.4px;">
                <div style="width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, #6366f1, #8b5cf6, #d946ef); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.45); flex-shrink: 0;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="m10 14 5 3-5 3v-6Z"/></svg>
                </div>
                <span>Sosyal Kütüphane</span>
            </a>
            <button class="nav-icon-btn nav-toggle-btn" aria-label="Menüyü aç/kapat" aria-expanded="false">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>
            <div class="nav-links">
                <a href="search.html" class="nav-link">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    Keşfet
                </a>
                <a href="feed.html" class="nav-link">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
                    Akış
                </a>
                <a href="social.html" class="nav-link">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Sosyal
                </a>
                <a href="profile.html" class="nav-link">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Profilim
                </a>
                <a href="messages.html" class="nav-link">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    Mesajlar
                </a>
                <div class="nav-icon-wrap">
                    <button class="nav-icon-btn" id="notifBellBtn" aria-label="Bildirimler">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                        <span class="nav-badge" id="notifBadge"></span>
                    </button>
                    <div class="nav-panel" id="notifPanel">
                        <div class="nav-panel-header">Bildirimler</div>
                        <div class="nav-panel-empty">Yükleniyor...</div>
                    </div>
                </div>
                <button class="nav-icon-btn theme-toggle-btn" aria-label="Tema değiştir">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                </button>
                <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
            </div>
        </div>
        <span id="userWelcome" style="display:none;"></span>
    </nav>

    <div class="wrapped-hero">
        <h1 id="heroTitle">🎉 Yılın Özeti</h1>
        <p>Bu yıl neler izledin, okudun ve paylaştın — birlikte bakalım</p>
        <select id="yearSelect" class="year-select" onchange="loadWrapped(this.value)"></select>
    </div>

    <div class="wrapped-container">
        <div id="wrappedLoading" class="wrapped-loading">⏳ Özet hazırlanıyor...</div>
        <div id="wrappedContent" style="display:none;"></div>
    </div>

    <script src="js/escape-html.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await app.initPromise;
            } catch (e) { }

            const currentYear = new Date().getFullYear();
            const yearSelect = document.getElementById('yearSelect');
            for (let y = currentYear; y >= currentYear - 4; y--) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                yearSelect.appendChild(opt);
            }

            loadWrapped(currentYear);
        });

        async function loadWrapped(year) {
            const loading = document.getElementById('wrappedLoading');
            const content = document.getElementById('wrappedContent');
            loading.style.display = 'block';
            content.style.display = 'none';

            try {
                const response = await fetch(`/api/wrapped.php?year=${year}`, { credentials: 'include' });
                const data = await response.json();

                if (!data.success) {
                    loading.textContent = '❌ Özet yüklenemedi';
                    return;
                }

                document.getElementById('heroTitle').textContent = `🎉 ${data.year} Yılın Özeti`;

                if (!data.has_data) {
                    content.innerHTML = `
                        <div class="wrapped-empty">
                            📭 ${data.year} yılı için henüz veri yok.<br>
                            <small>Film/dizi izleyip kitap okuyarak ve puanlayarak bu sayfayı doldurabilirsin!</small>
                        </div>
                    `;
                } else {
                    let html = '';

                    if (data.best_of_year) {
                        html += `
                            <div class="wrapped-highlight">
                                <div>${data.best_of_year.label} Yılın En Yüksek Puanlısı</div>
                                <div class="highlight-title">${app.escapeHtml(data.best_of_year.title)}</div>
                                <div>⭐ ${data.best_of_year.rating}/10</div>
                            </div>
                        `;
                    }

                    html += '<div class="wrapped-grid">';
                    html += statCard(data.total_items, 'Toplam İçerik');
                    html += statCard(data.movies.count, '🎬 İzlenen Film');
                    html += statCard(data.series.count, '📺 İzlenen Dizi');
                    html += statCard(data.books.count, '📚 Okunan Kitap');
                    html += statCard(data.total_ratings_given, '⭐ Verilen Puan');
                    html += statCard(data.total_comments, '💬 Yazılan Yorum');
                    html += statCard(data.new_followers, '👥 Yeni Takipçi');
                    if (data.favorite_genre) {
                        html += statCard(data.favorite_genre, '🎭 Favori Tür', true);
                    }
                    html += '</div>';

                    content.innerHTML = html;
                }

                loading.style.display = 'none';
                content.style.display = 'block';
            } catch (error) {
                console.error('Wrapped yükleme hatası:', error);
                loading.textContent = '❌ Bağlantı hatası';
            }
        }

        function statCard(value, label, isText = false) {
            const displayValue = isText ? app.escapeHtml(String(value)) : value;
            return `
                <div class="wrapped-card">
                    <div class="big-number" style="${isText ? 'font-size:24px;' : ''}">${displayValue}</div>
                    <div class="label">${label}</div>
                </div>
            `;
        }
    </script>
</body>

</html>
