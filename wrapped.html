    <meta charset="UTF-8">

    <style>
        /* Yıllık özet sayfasına özel stiller: kahraman alan, öne çıkan içerik, sayaçlar, aylık grafik. Ortak parçalar css/ui.css'te. */

        .wrap-hero {
            display: grid;
            gap: 18px;
            margin-bottom: 30px;
            padding: clamp(24px, 4vw, 44px);
            overflow: hidden;
            background:
                radial-gradient(700px 320px at 8% 0%, rgba(var(--color-accent-rgb), 0.34), transparent 70%),
                radial-gradient(600px 300px at 100% 100%, rgba(219, 39, 119, 0.24), transparent 70%),
                var(--glass-bg);
        }

        .wrap-title {
            font-size: clamp(34px, 6vw, 68px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .year-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .highlight {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 26px;
            margin-bottom: 26px;
            padding: 26px;
        }

        .highlight-poster {
            flex: none;
            width: 120px;
            aspect-ratio: 2 / 3;
            border-radius: var(--radius);
            background: var(--color-surface-2);
            box-shadow: 0 24px 48px -22px rgba(0, 0, 0, 0.7);
            object-fit: cover;
        }

        .highlight-text {
            display: grid;
            flex: 1;
            gap: 10px;
            min-width: 240px;
        }

        .highlight-title {
            font-size: clamp(24px, 3.4vw, 38px);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .highlight-score {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .highlight-score b {
            font-size: 44px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .stat-grid--wrapped {
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            margin-bottom: 26px;
        }

        .stat-grid--wrapped .stat-value {
            font-size: 40px;
        }

        .wrapped-split {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
            gap: 22px;
            margin-bottom: 26px;
        }

        .month-chart {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            align-items: end;
            gap: 8px;
            height: 220px;
            margin-top: 8px;
        }

        .month-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            height: 100%;
        }

        .month-count {
            color: var(--color-text-muted);
            font-size: 12px;
            font-weight: 800;
        }

        .month-bar {
            width: 100%;
            min-height: 4px;
            border-radius: 8px 8px 3px 3px;
            background: rgba(var(--color-accent-rgb), 0.4);
            transform-origin: bottom;
            transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .month-col.is-peak .month-bar {
            background: var(--color-accent-gradient);
            box-shadow: 0 12px 28px -12px rgba(var(--color-accent-rgb), 0.9);
        }

        .month-label {
            color: var(--color-text-faint);
            font-size: 11.5px;
            font-weight: 700;
        }

        .genre-list,
        .type-list {
            display: grid;
            gap: 14px;
            margin-top: 8px;
        }

        .genre-row-head {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 700;
        }

        .type-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--color-surface-2) 55%, transparent);
        }

        .type-row .person-text {
            min-width: 0;
        }

        .wrapped-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 34px;
        }

        :root[data-motion="reduced"] .month-bar {
            transition: none;
        }

        @media (max-width: 860px) {
            .wrapped-split {
                grid-template-columns: minmax(0, 1fr);
            }

            .month-chart {
                gap: 4px;
            }

            .month-label {
                font-size: 10px;
            }
        }
    </style>
</head>

    <main id="main" class="page page--narrow" style="width: min(1000px, calc(100% - 2 * var(--gutter)));">
        <header class="panel wrap-hero">
            <div>
                <span class="eyebrow"><span class="dot"></span>Yıllık özet</span>
                <h1 class="wrap-title" id="heroTitle">Yılın özeti</h1>
                <p class="page-sub">Bu yıl neler izledin, okudun ve paylaştın. Birlikte bakalım.</p>
            </div>
            <div class="year-chips" id="yearChips" role="group" aria-label="Yıl seç"></div>
        </header>

        <div id="wrappedLoading" class="loading" role="status">Özet hazırlanıyor...</div>
        <div id="wrappedContent" hidden></div>
    </main>

    <script src="js/escape-html.js"></script>
    <script src="js/app.js"></script>
    <script>
        const esc = (value) => app.escapeHtml(value);
        const MONTHS = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
        const TYPE_LABEL = { movie: 'Film', series: 'Dizi', book: 'Kitap' };
        let requestToken = 0;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await app.initPromise;
            } catch (e) { }
            if (!app.currentUser) {
                window.location.href = 'index.html';
                return;
            }

            const currentYear = new Date().getFullYear();
            const chips = document.getElementById('yearChips');
            for (let y = currentYear; y >= currentYear - 4; y--) {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'chip';
                button.dataset.year = y;
                button.textContent = y;
                button.addEventListener('click', () => loadWrapped(y));
                chips.appendChild(button);
            }

            const asked = Number.parseInt(new URLSearchParams(location.search).get('year'), 10);
            loadWrapped(Number.isInteger(asked) && asked <= currentYear && asked > currentYear - 5 ? asked : currentYear);
        });

        function markYear(year) {
            document.querySelectorAll('#yearChips .chip').forEach(chip => {
                chip.setAttribute('aria-pressed', Number(chip.dataset.year) === Number(year) ? 'true' : 'false');
            });
        }

        async function loadWrapped(year) {
            const token = ++requestToken;
            const loading = document.getElementById('wrappedLoading');
            const content = document.getElementById('wrappedContent');
            markYear(year);
            loading.className = 'loading';
            loading.textContent = 'Özet hazırlanıyor...';
            loading.hidden = false;
            content.hidden = true;

            try {
                const response = await fetch(`/api/wrapped.php?year=${Number(year)}`, { credentials: 'include' });
                const data = await response.json();
                if (token !== requestToken) return;

                if (!data.success) {
                    loading.className = 'error-message';
                    loading.textContent = 'Özet yüklenemedi. Sayfayı yenilemeyi dene.';
                    return;
                }

                document.getElementById('heroTitle').textContent = `${data.year} senin yılın`;
                document.title = `${data.year} Yıllık Özet - Sosyal Kütüphane`;
                content.innerHTML = data.has_data ? renderSummary(data) : renderEmpty(data.year);
                loading.hidden = true;
                content.hidden = false;
                if (data.has_data) animateIn(content);
            } catch (error) {
                console.error('Özet yükleme hatası:', error);
                if (token !== requestToken) return;
                loading.className = 'error-message';
                loading.textContent = 'Bağlantı hatası. Sayfayı yenilemeyi dene.';
            }
        }

        function renderEmpty(year) {
            return `<div class="empty">
                <div class="empty-icon">${app.icon('sparkles')}</div>
                <div class="empty-title">${esc(year)} için henüz veri yok</div>
                <p>Film ve dizi izleyip kitap okudukça, puanladıkça bu sayfa dolar.</p>
                <a class="btn btn-primary" href="search.html">Keşfet'e git</a>
            </div>`;
        }

        function statCard(value, label) {
            return `<div class="stat"><div class="stat-value" data-count="${Number(value) || 0}">0</div><div class="stat-label">${esc(label)}</div></div>`;
        }

        function renderHighlight(best) {
            if (!best) return '';
            const poster = best.poster ? `<img class="highlight-poster" src="${esc(best.poster)}" alt="" onerror="this.onerror=null;this.src='img/no-poster.svg'">` : '';
            const href = best.content_id !== null && best.content_id !== undefined
                ? `detail.php?type=${encodeURIComponent(best.type)}&id=${encodeURIComponent(best.content_id)}`
                : null;
            return `<section class="panel panel--accent highlight" aria-label="Yılın en yüksek puanlısı">
                ${poster}
                <div class="highlight-text">
                    <div class="cluster cluster--tight"><span class="eyebrow"><span class="dot"></span>Yılın en yüksek puanlısı</span><span class="chip">${esc(TYPE_LABEL[best.type] || 'İçerik')}</span></div>
                    <h2 class="highlight-title">${esc(best.title)}</h2>
                    <div class="highlight-score"><b>${esc(best.rating)}</b><span class="muted">/ 10 verdin</span></div>
                    ${href ? `<div><a class="btn-glass" href="${esc(href)}">Sayfasına git</a></div>` : ''}
                </div>
            </section>`;
        }

        function renderMonths(monthly) {
            const max = Math.max(1, ...monthly);
            const peak = monthly.indexOf(Math.max(...monthly));
            const columns = monthly.map((count, index) => `
                <div class="month-col${index === peak && count > 0 ? ' is-peak' : ''}" title="${esc(MONTHS[index])}: ${count} içerik">
                    <span class="month-count">${count || ''}</span>
                    <div class="month-bar" data-height="${Math.round((count / max) * 100)}" style="height: ${count ? Math.max(4, Math.round((count / max) * 100)) : 2}%;"></div>
                    <span class="month-label">${esc(MONTHS[index])}</span>
                </div>`).join('');
            const summary = monthly.map((count, index) => `${MONTHS[index]} ${count}`).join(', ');
            return `<section class="panel" aria-label="Aylık dağılım">
                <h2 class="panel-title">${app.icon('calendar')} Ay ay ne kadar izledin</h2>
                <div class="month-chart" role="img" aria-label="Aylık içerik sayıları: ${esc(summary)}">${columns}</div>
            </section>`;
        }

        function renderGenres(topGenres) {
            if (!topGenres.length) {
                return `<section class="panel"><h2 class="panel-title">${app.icon('heart')} Favori türlerin</h2><p class="muted" style="margin-top: 10px;">Türler, izlediğin film ve dizilerin detaylarından hesaplanır. Bu yıl için henüz tür bilgisi yok.</p></section>`;
            }
            const max = topGenres[0].count;
            return `<section class="panel">
                <h2 class="panel-title">${app.icon('heart')} Favori türlerin</h2>
                <div class="genre-list">${topGenres.map(genre => `
                    <div>
                        <div class="genre-row-head"><span>${esc(genre.name)}</span><span class="muted">${Number(genre.count)}</span></div>
                        <div class="meter"><span style="width: ${Math.round((genre.count / max) * 100)}%;"></span></div>
                    </div>`).join('')}
                </div>
            </section>`;
        }

        function renderTypes(data) {
            const rows = [
                ['movie', 'film', data.movies, 'izlendi'],
                ['series', 'dizi', data.series, 'izlendi'],
                ['book', 'kitap', data.books, 'okundu']
            ].map(([type, noun, info, verb]) => `
                <div class="type-row">
                    <div class="person-text"><span class="person-name">${esc(TYPE_LABEL[type])}</span><span class="person-sub">${Number(info.count)} ${noun} ${verb}</span></div>
                    ${info.avg_rating !== null ? `<span class="chip chip--warm">Ort. ★ ${esc(info.avg_rating)}</span>` : '<span class="chip">Puan yok</span>'}
                </div>`).join('');
            return `<section class="panel"><h2 class="panel-title">${app.icon('star')} Türe göre</h2><div class="type-list">${rows}</div></section>`;
        }

        function renderSummary(data) {
            return `
                ${renderHighlight(data.best_of_year)}
                <div class="stat-grid stat-grid--wrapped">
                    ${statCard(data.total_items, 'Toplam içerik')}
                    ${statCard(data.movies.count, 'İzlenen film')}
                    ${statCard(data.series.count, 'İzlenen dizi')}
                    ${statCard(data.books.count, 'Okunan kitap')}
                    ${statCard(data.total_ratings_given, 'Verilen puan')}
                    ${statCard(data.total_comments, 'Yazılan yorum')}
                    ${statCard(data.new_followers, 'Yeni takipçi')}
                </div>
                <div class="wrapped-split">
                    ${renderMonths(data.monthly || new Array(12).fill(0))}
                    ${renderGenres(data.top_genres || [])}
                </div>
                ${renderTypes(data)}
                <div class="wrapped-actions">
                    <a class="btn btn-primary" href="profile.html">Profilime dön</a>
                    <a class="btn-glass" href="tonight.html">Bu akşam ne izlesem?</a>
                </div>`;
        }

        // Sayaçlar 0'dan değerine sayar, aylık çubuklar aşağıdan yükselir. Azaltılmış harekette doğrudan son hâli gösterilir.
        function animateIn(root) {
            const counters = root.querySelectorAll('[data-count]');
            const bars = root.querySelectorAll('.month-bar');

            if (motionReduced()) {
                counters.forEach(el => { el.textContent = el.dataset.count; });
                return;
            }

            bars.forEach(bar => { bar.style.transform = 'scaleY(0)'; });
            requestAnimationFrame(() => requestAnimationFrame(() => bars.forEach(bar => { bar.style.transform = 'scaleY(1)'; })));

            const started = performance.now();
            const duration = 900;
            const tick = (now) => {
                const t = Math.min(1, (now - started) / duration);
                const eased = 1 - Math.pow(1 - t, 3);
                counters.forEach(el => { el.textContent = Math.round(Number(el.dataset.count) * eased); });
                if (t < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        }
    </script>
