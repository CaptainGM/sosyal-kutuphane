<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#05060b">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>Yönetim Konsolu - Sosyal Kütüphane</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
    <script src="js/motion.js"></script>
    <style>
        /* Yönetim konsolu: sol menü + içerik. Ortak parçalar (panel, tablo, çip, sayfalama) css/ui.css'te. */

        .admin-layout {
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr);
            gap: 26px;
            align-items: start;
        }

        .admin-nav {
            position: sticky;
            top: 96px;
            display: grid;
            gap: 6px;
            padding: 12px;
        }

        .admin-nav-title {
            padding: 6px 12px 10px;
            color: var(--color-text-faint);
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .admin-nav button {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 11px 14px;
            border: 0;
            border-radius: 12px;
            background: transparent;
            color: var(--color-text-muted);
            font: inherit;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .admin-nav button:hover {
            background: rgba(var(--color-accent-rgb), 0.1);
            color: var(--color-text);
        }

        .admin-nav button:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        .admin-nav button.active {
            background: var(--color-accent-gradient);
            color: #ffffff;
            box-shadow: 0 12px 26px -12px rgba(var(--color-accent-rgb), 0.95);
        }

        .admin-nav .ui-i {
            width: 18px;
            height: 18px;
        }

        .admin-nav .nav-count {
            min-width: 22px;
            margin-left: auto;
            padding: 1px 8px;
            border-radius: var(--radius-pill);
            background: rgba(var(--color-danger-rgb), 0.9);
            color: #ffffff;
            font-size: 11.5px;
            font-weight: 800;
            text-align: center;
        }

        .admin-nav .nav-count:empty {
            display: none;
        }

        .admin-head {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 14px 24px;
            margin-bottom: 22px;
        }

        .admin-head h2 {
            font-size: clamp(24px, 3vw, 34px);
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .admin-head p {
            max-width: 62ch;
            margin-top: 6px;
            color: var(--color-text-muted);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .toolbar .input {
            flex: 1 1 240px;
            max-width: 360px;
        }

        .toolbar .select {
            width: auto;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stat-grid--admin {
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            margin-bottom: 24px;
        }

        .stat-grid--admin .stat-value {
            font-size: 30px;
        }

        .stat.is-alert {
            border-color: rgba(var(--color-danger-rgb), 0.5);
            background: rgba(var(--color-danger-rgb), 0.08);
        }

        .overview-split {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .mini-bars {
            display: grid;
            grid-template-columns: repeat(14, minmax(0, 1fr));
            align-items: end;
            gap: 4px;
            height: 110px;
            margin-top: 12px;
        }

        .mini-bar {
            min-height: 3px;
            border-radius: 5px 5px 2px 2px;
            background: rgba(var(--color-accent-rgb), 0.45);
        }

        .mini-bar.is-today {
            background: var(--color-accent-gradient);
        }

        .mini-axis {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            color: var(--color-text-faint);
            font-size: 11px;
        }

        .mini-total {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .mini-total b {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .row-list {
            display: grid;
            gap: 10px;
            margin-top: 12px;
        }

        .row-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 12px;
            color: inherit;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .row-link:hover,
        .row-link:focus-visible {
            background: rgba(var(--color-accent-rgb), 0.1);
            outline: none;
        }

        .row-link img {
            flex: none;
            width: 38px;
            aspect-ratio: 2 / 3;
            border-radius: 6px;
            background: var(--color-surface-2);
            object-fit: cover;
        }

        .row-link .grow {
            flex: 1;
            min-width: 0;
        }

        .content-ref {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 8px;
        }

        .clip {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cell-text {
            display: -webkit-box;
            max-width: 460px;
            min-width: 220px;
            overflow: hidden;
            line-height: 1.45;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow-wrap: anywhere;
        }

        .cell-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 6px;
        }

        .table td.num {
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .table td.nowrap {
            white-space: nowrap;
        }

        tr.is-clickable {
            cursor: pointer;
        }

        .pager-note {
            margin-top: 10px;
            font-size: 13px;
            text-align: center;
        }

        .btn-sm.btn-danger-soft {
            border: 1px solid rgba(var(--color-danger-rgb), 0.45);
            background: rgba(var(--color-danger-rgb), 0.1);
            color: var(--color-danger);
        }

        .btn-sm.btn-danger-soft:hover {
            background: rgba(var(--color-danger-rgb), 0.18);
        }

        .quote {
            padding: 14px 16px;
            border-left: 3px solid var(--color-accent);
            border-radius: 0 var(--radius) var(--radius) 0;
            background: rgba(var(--color-accent-rgb), 0.08);
            line-height: 1.6;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .quote + .quote {
            margin-top: 10px;
        }

        .versions {
            display: grid;
            gap: 14px;
        }

        .version {
            display: grid;
            gap: 6px;
        }

        .version-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            color: var(--color-text-faint);
            font-size: 12.5px;
            font-weight: 700;
        }

        .detail-grid {
            display: grid;
            gap: 22px;
        }

        .detail-block h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 800;
        }

        .detail-block h3 svg {
            width: 17px;
            height: 17px;
            color: var(--color-accent);
        }

        .kv {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 10px 20px;
        }

        .kv div {
            display: grid;
            gap: 2px;
        }

        .kv dt {
            color: var(--color-text-faint);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .kv dd {
            overflow-wrap: anywhere;
        }

        .report-card {
            display: grid;
            gap: 12px;
            padding: 18px 20px;
        }

        .report-card + .report-card {
            margin-top: 14px;
        }

        .report-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 16px;
        }

        .mini-list {
            display: grid;
            gap: 8px;
        }

        .mini-item {
            padding: 10px 14px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--color-surface-2) 55%, transparent);
            font-size: 14px;
        }

        .mini-item .meta-line {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-bottom: 4px;
            color: var(--color-text-faint);
            font-size: 12.5px;
        }

        .denied {
            max-width: 560px;
            margin: 70px auto;
        }

        @media (max-width: 960px) {
            .admin-layout {
                grid-template-columns: minmax(0, 1fr);
            }

            .admin-nav {
                position: relative;
                top: auto;
                grid-auto-flow: column;
                grid-auto-columns: max-content;
                overflow-x: auto;
            }

            .admin-nav-title {
                display: none;
            }
        }
    </style>
</head>

    <main id="main" class="page page--wide">
        <div id="adminGate" class="loading" role="status">Yönetim konsolu hazırlanıyor...</div>

        <div id="adminApp" class="admin-layout" hidden>
            <nav class="panel admin-nav" aria-label="Yönetim bölümleri" id="adminNav"></nav>
            <section id="adminMain" aria-live="polite" tabindex="-1"></section>
        </div>
    </main>

    <script src="js/escape-html.js"></script>
    <script src="js/app.js"></script>
    <script>
        const esc = (value) => app.escapeHtml(value);

        const TABS = [
            { id: 'overview', label: 'Genel bakış', icon: 'eye' },
            { id: 'users', label: 'Kullanıcılar', icon: 'users' },
            { id: 'comments', label: 'Yorumlar', icon: 'message' },
            { id: 'deleted', label: 'Silinenler', icon: 'trash' },
            { id: 'reports', label: 'Şikâyetler', icon: 'flag' },
            { id: 'tickets', label: 'Talepler', icon: 'lifebuoy' },
            { id: 'moderation', label: 'Engellenen denemeler', icon: 'shield' },
            { id: 'audit', label: 'İşlem günlüğü', icon: 'history' }
        ];

        const AUDIT_LABELS = {
            'comment.delete': 'Yorumu sildi',
            'comment.restore': 'Yorumu geri yükledi',
            'report.delete_comment': 'Şikâyet üzerine yorumu sildi',
            'report.dismiss': 'Şikâyeti reddetti',
            'user.suspend': 'Hesabı askıya aldı',
            'user.unsuspend': 'Askıyı kaldırdı',
            'user.mute': 'Kullanıcıyı susturdu',
            'user.unmute': 'Susturmayı kaldırdı',
            'ticket.resolve': 'Talebi çözüldü olarak işaretledi',
            'ticket.reopen': 'Talebi çözülmedi olarak işaretledi'
        };

        const TYPE_LABEL = { movie: 'Film', series: 'Dizi', book: 'Kitap' };
        const STATUS_LABEL = { watched: 'İzlendi', watching: 'İzleniyor', watchlist: 'İzlenecek', read: 'Okundu', to_read: 'Okunacak', readinglist: 'Okunacak' };

        const state = {
            tab: 'overview',
            users: { page: 1, q: '', status: '', sort: 'new' },
            comments: { page: 1, q: '', filter: 'all', userId: null, userName: '' },
            deleted: { page: 1 },
            reports: { status: 'pending', page: 1 },
            tickets: { status: 'open', page: 1 },
            moderation: { page: 1 },
            audit: { page: 1, target: '' }
        };
        let searchTimer = null;
        let activeModal = null;
        let listToken = 0;

        // --- Ağ ---
        async function adminGet(params) {
            const response = await fetch('/api/admin.php?' + new URLSearchParams(params), { credentials: 'include' });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success) throw new Error(data.message || 'İstek başarısız oldu');
            return data;
        }

        async function adminPost(body) {
            const response = await fetch('/api/admin.php', {
                method: 'POST',
                headers: app.authHeaders(),
                credentials: 'include',
                body: JSON.stringify(body)
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success) throw new Error(data.message || 'İşlem başarısız oldu');
            return data;
        }

        // --- Biçim yardımcıları ---
        function fmtDate(iso) {
            if (!iso) return '—';
            return app.parseServerDate(iso).toLocaleString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function ago(iso) {
            return iso ? app.getTimeAgo(iso) : '—';
        }

        function isFuture(iso) {
            return Boolean(iso) && app.parseServerDate(iso).getTime() > Date.now();
        }

        function loadingBlock() {
            return '<div class="loading">Yükleniyor...</div>';
        }

        function errorBlock(message) {
            return `<div class="error-message">${esc(message)}</div>`;
        }

        function emptyBlock(icon, title, hint) {
            return `<div class="empty"><div class="empty-icon">${app.icon(icon)}</div><div class="empty-title">${esc(title)}</div>${hint ? `<p>${esc(hint)}</p>` : ''}</div>`;
        }

        function pagerHtml(key, page, perPage, total) {
            const pages = Math.max(1, Math.ceil(total / perPage));
            if (pages <= 1) return `<p class="faint pager-note">Toplam ${Number(total)} kayıt</p>`;
            return `<nav class="pagination" aria-label="Sayfalar">
                <button type="button" data-act="page" data-key="${key}" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}>Önceki</button>
                <span class="active">${page} / ${pages}</span>
                <button type="button" data-act="page" data-key="${key}" data-page="${page + 1}" ${page >= pages ? 'disabled' : ''}>Sonraki</button>
            </nav><p class="faint pager-note">Toplam ${Number(total)} kayıt</p>`;
        }

        function userChips(user, mutedUntil) {
            const chips = [];
            if (user && user.is_admin) chips.push('<span class="chip chip--accent">Yönetici</span>');
            if (user && user.status === 'suspended') chips.push('<span class="chip chip--danger">Askıda</span>');
            if (isFuture(mutedUntil)) chips.push('<span class="chip chip--warm">Susturulmuş</span>');
            return chips.join('');
        }

        function userCell(user, sub) {
            if (!user) return '<span class="faint">Silinmiş kullanıcı</span>';
            return `<div class="person">
                ${app.avatarMarkup(user.avatar_url, user.username, 'sm')}
                <span class="person-text"><span class="person-name">${esc(user.username)}</span>${sub ? `<span class="person-sub">${esc(sub)}</span>` : ''}</span>
            </div>`;
        }

        function contentLink(content) {
            if (!content || !content.type) return '<span class="faint">—</span>';
            const label = content.title || `${TYPE_LABEL[content.type] || 'İçerik'} #${content.id}`;
            return `<span class="content-ref"><a href="${esc(content.url)}" target="_blank" rel="noopener">${esc(label)}</a><span class="chip">${esc(TYPE_LABEL[content.type] || content.type)}</span></span>`;
        }

        // --- Gezinti ---
        function buildNav() {
            document.getElementById('adminNav').innerHTML = '<div class="admin-nav-title">Yönetim</div>' + TABS.map(tab => `
                <button type="button" data-act="tab" data-tab="${tab.id}" aria-current="${tab.id === state.tab ? 'page' : 'false'}" class="${tab.id === state.tab ? 'active' : ''}">
                    ${app.icon(tab.icon)} <span>${esc(tab.label)}</span>
                    <span class="nav-count" id="count-${tab.id}"></span>
                </button>`).join('');
        }

        function showTab(name, options = {}) {
            if (!TABS.some(tab => tab.id === name)) name = 'overview';
            state.tab = name;
            if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
            document.querySelectorAll('#adminNav button').forEach(button => {
                const active = button.dataset.tab === name;
                button.classList.toggle('active', active);
                button.setAttribute('aria-current', active ? 'page' : 'false');
            });
            const renderers = { overview: renderOverview, users: renderUsers, comments: renderComments, deleted: renderDeleted, reports: renderReports, tickets: renderTickets, moderation: renderModeration, audit: renderAudit };
            renderers[name](options);
            refreshCounts();
        }

        async function refreshCounts() {
            try {
                const data = await adminGet({ action: 'overview' });
                const pending = document.getElementById('count-reports');
                if (pending) pending.textContent = data.totals.reports_pending || '';
                const tickets = document.getElementById('count-tickets');
                if (tickets) tickets.textContent = data.totals.tickets_open || '';
            } catch (error) { }
        }

        function reloadCurrent() {
            showTab(state.tab);
        }

        function head(title, description, extra) {

        // =========================================================

        function miniChart(title, rows, key) {
            const values = rows.map(row => Number(row[key]) || 0);
            const max = Math.max(1, ...values);
            const total = values.reduce((a, b) => a + b, 0);
            const bars = rows.map((row, index) => `<div class="mini-bar${index === rows.length - 1 ? ' is-today' : ''}" style="height: ${Math.max(3, Math.round((values[index] / max) * 100))}%;" title="${esc(row.date)}: ${values[index]}"></div>`).join('');
            return `<section class="panel">
                <h3 class="panel-title">${esc(title)}</h3>
                <div class="mini-total"><b>${total}</b><span class="muted">son 14 gün</span></div>
                <div class="mini-bars" role="img" aria-label="${esc(title)}, son 14 gün: ${values.join(', ')}">${bars}</div>
                <div class="mini-axis"><span>${esc(rows[0].date.slice(5))}</span><span>bugün</span></div>
            </section>`;
        }

        // --- Tek tıklama dağıtıcısı ---
        document.addEventListener('click', (event) => {
            const el = event.target.closest('[data-act]');
            if (!el) return;
            const act = el.dataset.act;
            const id = Number(el.dataset.id);

            // Tablo satırı tıklaması içindeki düğmelerle çift tetiklenmesin
            if (el.tagName === 'TR' && event.target.closest('button, a')) return;
            if (el.tagName !== 'TR') event.stopPropagation();

            switch (act) {
                case 'tab': showTab(el.dataset.tab); break;
                case 'refresh': reloadCurrent(); break;
                case 'page': {
                    const key = el.dataset.key;
                    state[key].page = Math.max(1, Number(el.dataset.page));
                    ({ users: loadUsers, comments: loadComments, deleted: loadDeleted, reports: loadReports, tickets: loadTickets, moderation: loadModeration, audit: loadAudit })[key]();
                    window.scrollTo({ top: 0, behavior: motionReduced() ? 'auto' : 'smooth' });
                    break;
                }
                case 'user-filter': state.users.status = el.dataset.value; state.users.page = 1; loadUsers(); break;
                case 'comment-filter': state.comments.filter = el.dataset.value; state.comments.page = 1; loadComments(); break;
                case 'report-filter': state.reports.status = el.dataset.value; state.reports.page = 1; loadReports(); break;
                case 'ticket-filter': state.tickets.status = el.dataset.value; state.tickets.page = 1; loadTickets(); break;
                case 'ticket-resolve': resolveTicket(id); break;
                case 'ticket-reopen': reopenTicket(id); break;
                case 'audit-filter': state.audit.target = el.dataset.value; state.audit.page = 1; loadAudit(); break;
                case 'clear-user-filter': state.comments.userId = null; state.comments.userName = ''; state.comments.page = 1; renderComments(); break;
                case 'open-user': openUser(id); break;
                case 'open-comment': openComment(id); break;
                case 'user-comments':
                    if (activeModal) activeModal.close();
                    showTab('comments', { userId: id, userName: el.dataset.name });
                    break;
                case 'delete-comment': deleteComment(id, el.dataset.close === '1'); break;
                case 'restore': restoreComment(id); break;
                case 'resolve-delete': resolveReport(id, 'delete_comment'); break;
                case 'resolve-dismiss': resolveReport(id, 'dismiss'); break;
                case 'suspend': suspendUser(id, el.dataset.name); break;
                case 'unsuspend': simpleUserAction('unsuspend_user', id, 'Askı kaldırıldı'); break;
                case 'mute': muteUser(id, el.dataset.name); break;
                case 'unmute': simpleUserAction('unmute_user', id, 'Susturma kaldırıldı'); break;
            }
        });

        // --- Açılış ---
        document.addEventListener('DOMContentLoaded', async () => {
            try { await app.initPromise; } catch (e) { }
            const gate = document.getElementById('adminGate');

            if (!app.currentUser) {
                window.location.href = 'index.html';
                return;
            }
            if (!app.currentUser.is_admin) {
                gate.className = 'empty denied';
                gate.innerHTML = `<div class="empty-icon">${app.icon('lock')}</div><div class="empty-title">Bu sayfaya erişimin yok</div><p>Yönetim konsolu yalnızca yöneticilere açıktır.</p><a class="btn btn-primary" href="search.html">Keşfet'e dön</a>`;
                return;
            }

            gate.hidden = true;
            document.getElementById('adminApp').hidden = false;
            const initial = (location.hash || '').replace('#', '');
            state.tab = TABS.some(tab => tab.id === initial) ? initial : 'overview';
            buildNav();
            showTab(state.tab);
            window.addEventListener('hashchange', () => {
                const name = (location.hash || '').replace('#', '');
                if (name !== state.tab) showTab(name);
            });
        });
    </script>
</body>

</html>
