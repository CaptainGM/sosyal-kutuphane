<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>Paylaşılan Liste - Sosyal Kütüphane</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .public-header {
            background: var(--color-accent-gradient);
            padding: 15px 0;
        }

        .public-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .public-header .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
        }

        .list-header {
            padding: 40px 0 20px;
            text-align: center;
        }

        .list-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .list-header p {
            color: var(--color-text-muted);
        }

        .list-owner {
            color: var(--color-text-faint);
            font-size: 14px;
            margin-top: 8px;
        }

        .public-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 18px;
            padding: 20px 0 60px;
        }

        .public-item-card {
            cursor: pointer;
            text-align: center;
        }

        .public-item-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 8px;
            background: var(--color-surface-2);
        }

        .public-item-card .item-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
        }
    </style>
</head>

<body>
    <div class="public-header">
        <div class="container">
            <a href="search.html" class="logo">🎬 Sosyal Kütüphane</a>
            <a href="index.html" class="btn" style="background:rgba(255,255,255,0.2);color:white;border:1px solid white;">Giriş Yap</a>
        </div>
    </div>

    <div class="container">
        <div id="loading" class="loading">⏳ Liste yükleniyor...</div>
        <div id="listContent" style="display:none;">
            <div class="list-header">
                <h1 id="listName"></h1>
                <p id="listDescription"></p>
                <div class="list-owner" id="listOwner"></div>
            </div>
            <div class="public-list-grid" id="itemsGrid"></div>
        </div>
    </div>

    <script src="js/escape-html.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadSharedList);

        function goToDetail(type, id) {
            window.location.href = `detail.php?type=${type}&id=${id}`;
        }

        async function loadSharedList() {
            const params = new URLSearchParams(window.location.search);
            const listId = params.get('id');
            const loading = document.getElementById('loading');

            if (!listId) {
                loading.textContent = '❌ Geçersiz liste';
                return;
            }

            try {
                const response = await fetch(`/api/public-list.php?id=${listId}`);
                const data = await response.json();

                if (!data.success) {
                    loading.textContent = '❌ Bu liste bulunamadı ya da artık herkese açık değil';
                    return;
                }

                const list = data.list;
                document.getElementById('listName').textContent = list.name;
                document.getElementById('listDescription').textContent = list.description || '';
                if (list.owner) {
                    document.getElementById('listOwner').textContent = `👤 ${list.owner.username} tarafından paylaşıldı`;
                }

                const grid = document.getElementById('itemsGrid');
                if (list.items.length === 0) {
                    grid.innerHTML = '<div class="no-results">Bu listede henüz içerik yok</div>';
                } else {
                    grid.innerHTML = list.items.map(item => `
                        <div class="public-item-card" onclick="goToDetail('${item.content_type}', '${item.content_id}')">
                            <img src="https://placehold.co/150x210?text=Yükleniyor" alt="${app.escapeHtml(item.content_title)}"
                                 class="item-poster" data-item-id="${item.content_id}" data-item-type="${item.content_type}">
                            <div class="item-title">${app.escapeHtml(item.content_title)}</div>
                        </div>
                    `).join('');
                    loadPosters(list.items);
                }

                loading.style.display = 'none';
                document.getElementById('listContent').style.display = 'block';
            } catch (error) {
                console.error('Liste yükleme hatası:', error);
                loading.textContent = '❌ Bağlantı hatası';
            }
        }

        async function loadPosters(items) {
            for (const item of items) {
                try {
                    let posterUrl = 'https://placehold.co/150x210?text=Resim+Yok';

                    if (item.content_type === 'movie') {
                        const movie = await app.getMovieDetail(item.content_id);
                        if (movie?.poster_path) posterUrl = `https://image.tmdb.org/t/p/w300${movie.poster_path}`;
                    } else if (item.content_type === 'series') {
                        const series = await app.getSeriesDetail(item.content_id);
                        if (series?.poster_path) posterUrl = `https://image.tmdb.org/t/p/w300${series.poster_path}`;
                    } else {
                        const book = await app.getBookDetail(item.content_id);
                        if (book?.volumeInfo?.imageLinks?.thumbnail) {
                            posterUrl = book.volumeInfo.imageLinks.thumbnail.replace('http://', 'https://');
                        }
                    }

                    const img = document.querySelector(`img[data-item-id="${item.content_id}"][data-item-type="${item.content_type}"]`);
                    if (img) img.src = posterUrl;
                } catch (error) {
                    console.error('Poster yükleme hatası:', error);
                }
            }
        }
    </script>
</body>

</html>
