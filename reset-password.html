<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırla - Sosyal Kütüphane</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--color-accent-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--color-surface);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            color: var(--color-text);
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: var(--color-text-muted);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-text);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--color-border);
            border-radius: 10px;
            font-size: 16px;
            background: var(--color-surface);
            color: var(--color-text);
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--color-accent-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .message.success {
            background: var(--color-success-bg);
            color: var(--color-success);
            border: 1px solid var(--color-success);
        }

        .message.error {
            background: var(--color-danger-bg);
            color: var(--color-danger);
            border: 1px solid var(--color-danger);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--color-accent);
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .password-strength {
            height: 5px;
            background: var(--color-border);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background 0.3s;
        }

        .strength-text {
            font-size: 12px;
            margin-top: 5px;
            color: var(--color-text-muted);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔐 Yeni Şifre Belirle</h1>
        <p class="subtitle">Hesabınız için yeni bir şifre oluşturun.</p>

        <div id="messageBox" class="message" style="display: none;"></div>

        <form id="resetForm">
            <div class="form-group">
                <label>Yeni Şifre</label>
                <input type="password" id="password" placeholder="En az 6 karakter" required minlength="6">
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <div class="form-group">
                <label>Şifre Tekrar</label>
                <input type="password" id="passwordConfirm" placeholder="Şifrenizi tekrar girin" required>
            </div>

            <button type="submit" class="btn" id="submitBtn">Şifreyi Güncelle</button>
        </form>

        <div class="back-link">
            <a href="login.html">← Giriş Sayfasına Dön</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showMessage('Geçersiz veya eksik token! Lütfen e-postanızdaki linke tıklayın.', 'error');
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('password').addEventListener('input', function () {
            const password = this.value;
            const strength = calculateStrength(password);
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');

            bar.style.width = strength.percent + '%';
            bar.style.background = strength.color;
            text.textContent = strength.text;
            text.style.color = strength.color;
        });

        function calculateStrength(password) {
            let score = 0;
            if (password.length >= 6) score++;
            if (password.length >= 10) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[^a-zA-Z0-9]/.test(password)) score++;

            const levels = [
                { percent: 20, color: '#dc3545', text: 'Çok Zayıf' },
                { percent: 40, color: '#fd7e14', text: 'Zayıf' },
                { percent: 60, color: '#ffc107', text: 'Orta' },
                { percent: 80, color: '#28a745', text: 'Güçlü' },
                { percent: 100, color: '#20c997', text: 'Çok Güçlü' }
            ];

            return levels[Math.min(score, 4)];
        }

        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const submitBtn = document.getElementById('submitBtn');

            if (password !== passwordConfirm) {
                showMessage('Şifreler eşleşmiyor!', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Şifre en az 6 karakter olmalıdır!', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Güncelleniyor...';

            try {
                const response = await fetch('/api/reset-password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('Şifreniz başarıyla güncellendi! Yönlendiriliyorsunuz...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage(data.message || 'Bir hata oluştu!', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Şifreyi Güncelle';
                }
            } catch (error) {
                showMessage('Bağlantı hatası!', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Şifreyi Güncelle';
            }
        });

        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'message ' + type;
            box.style.display = 'block';
        }
    </script>
    <script src="js/escape-html.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
