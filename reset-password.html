<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#05060b">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>Şifre Sıfırla - Sosyal Kütüphane</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
    <script src="js/motion.js"></script>
    <style>
        /* Şifre sıfırlama: gezinme çubuğu olmayan, ortalanmış tek kart. */

        .auth-shell {
            display: grid;
            min-height: 100vh;
            min-height: 100dvh;
            place-items: center;
            padding: 28px var(--gutter);
        }

        .auth-card {
            display: grid;
            gap: 20px;
            width: min(460px, 100%);
            padding: clamp(24px, 5vw, 38px);
        }

        .auth-brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--color-text);
            font-size: 17px;
            font-weight: 800;
            text-decoration: none;
        }

        .auth-title {
            font-size: clamp(26px, 5vw, 34px);
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -0.03em;
        }

        .auth-form {
            display: grid;
            gap: 16px;
        }

        .strength {
            display: grid;
            gap: 6px;
            margin-top: 10px;
        }

        .strength .meter > span {
            width: 0;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .strength-text {
            min-height: 1.2em;
            font-size: 12.5px;
            font-weight: 700;
        }

        .match-text {
            min-height: 1.2em;
            font-size: 12.5px;
            font-weight: 700;
        }

        .auth-back {
            color: var(--color-accent);
            font-weight: 700;
            text-align: center;
            text-decoration: none;
        }

        .auth-back:hover {
            text-decoration: underline;
        }

        :root[data-motion="reduced"] .strength .meter > span {
            transition: none;
        }
    </style>
</head>

<body>
    <main id="main" class="auth-shell">
        <section class="panel auth-card" aria-labelledby="resetTitle">
            <a class="auth-brand" href="index.html">
                <span class="logo-mark"><img src="img/logo.svg" alt="" width="34" height="34"></span>
                Sosyal Kütüphane
            </a>

            <div>
                <h1 id="resetTitle" class="auth-title">Yeni şifre belirle</h1>
                <p class="page-sub" style="margin-top: 8px;">Hesabın için güçlü yeni bir şifre oluştur.</p>
            </div>

            <div id="messageBox" class="notice" role="alert" hidden></div>

            <form id="resetForm" class="auth-form" novalidate>
                <div class="field">
                    <label for="password">Yeni şifre</label>
                    <input type="password" id="password" class="input" placeholder="En az 8 karakter" required autocomplete="new-password" aria-describedby="passwordRules">
                    <ul class="pw-rules" id="passwordRules" aria-live="polite">
                        <li data-rule="length">En az 8 karakter</li>
                        <li data-rule="upper">En az bir büyük harf</li>
                        <li data-rule="lower">En az bir küçük harf</li>
                        <li data-rule="special">En az bir özel karakter (! @ # ? vb.)</li>
                    </ul>
                    <div class="strength">
                        <div class="meter"><span id="strengthBar"></span></div>
                        <div class="strength-text" id="strengthText" aria-live="polite"></div>
                    </div>
                </div>

                <div class="field">
                    <label for="passwordConfirm">Şifre tekrar</label>
                    <input type="password" id="passwordConfirm" class="input" placeholder="Şifreni tekrar gir" required autocomplete="new-password" aria-describedby="matchText">
                    <div class="match-text" id="matchText" aria-live="polite"></div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%;">Şifreyi güncelle</button>
            </form>

            <a class="auth-back" href="index.html">← Giriş sayfasına dön</a>
        </section>
    </main>

    <script src="js/escape-html.js"></script>
    <script src="js/app.js"></script>
    <script src="js/password-rules.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        const form = document.getElementById('resetForm');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('passwordConfirm');
        const submitBtn = document.getElementById('submitBtn');

        wirePasswordRules('password', 'passwordRules');

        if (!token) {
            showMessage('Bu bağlantıda sıfırlama kodu yok. Lütfen e-postandaki bağlantıya yeniden tıkla ya da giriş sayfasından yeni bir bağlantı iste.', 'danger');
            form.hidden = true;
        }

        // Şifre kuralları sunucuyla aynıdır (api/lib/password.php): 8+ karakter, büyük harf, küçük harf, özel karakter.
        function passwordMeetsRules(value) {
            return value.length >= 8 && /\p{Lu}/u.test(value) && /\p{Ll}/u.test(value) && /[^\p{L}\p{N}\s]/u.test(value);
        }

        function calculateStrength(value) {
            let score = 0;
            if (value.length >= 8) score++;
            if (value.length >= 12) score++;
            if (/\p{Lu}/u.test(value) && /\p{Ll}/u.test(value)) score++;
            if (/\d/.test(value)) score++;
            if (/[^\p{L}\p{N}\s]/u.test(value)) score++;
            const levels = [
                { percent: 12, color: 'var(--color-danger)', text: value ? 'Çok zayıf' : '' },
                { percent: 30, color: 'var(--color-danger)', text: 'Zayıf' },
                { percent: 55, color: 'var(--color-warm)', text: 'Orta' },
                { percent: 78, color: 'var(--color-success)', text: 'Güçlü' },
                { percent: 100, color: 'var(--color-success)', text: 'Çok güçlü' }
            ];
            return levels[Math.min(score, 4)];
        }

        passwordInput.addEventListener('input', () => {
            const strength = calculateStrength(passwordInput.value);
            const bar = document.getElementById('strengthBar');
            bar.style.width = passwordInput.value ? strength.percent + '%' : '0';
            bar.style.background = strength.color;
            const text = document.getElementById('strengthText');
            text.textContent = strength.text;
            text.style.color = strength.color;
            updateMatch();
        });

        function updateMatch() {
            const text = document.getElementById('matchText');
            if (!confirmInput.value) {
                text.textContent = '';
                return;
            }
            const same = confirmInput.value === passwordInput.value;
            text.textContent = same ? 'Şifreler eşleşiyor' : 'Şifreler eşleşmiyor';
            text.style.color = same ? 'var(--color-success)' : 'var(--color-danger)';
        }
        confirmInput.addEventListener('input', updateMatch);

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const password = passwordInput.value;

            if (!passwordMeetsRules(password)) {
                showMessage('Şifre kurallara uymuyor: en az 8 karakter, büyük harf, küçük harf ve özel karakter gerekir.', 'danger');
                passwordInput.focus();
                return;
            }
            if (password !== confirmInput.value) {
                showMessage('Şifreler eşleşmiyor.', 'danger');
                confirmInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Güncelleniyor...';
            try {
                const response = await fetch('/api/reset-password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await response.json();
                if (data.success) {
                    showMessage('Şifren güncellendi. Giriş sayfasına yönlendiriliyorsun...', 'success');
                    form.hidden = true;
                    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                } else {
                    showMessage(data.message || 'Bir hata oluştu.', 'danger');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Şifreyi güncelle';
                }
            } catch (error) {
                showMessage('Bağlantı hatası. Lütfen tekrar dene.', 'danger');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Şifreyi güncelle';
            }
        });

        function showMessage(text, kind) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'notice' + (kind === 'danger' ? ' notice--danger' : '');
            if (kind === 'success') {
                box.style.borderColor = 'color-mix(in srgb, var(--color-success) 55%, transparent)';
                box.style.background = 'var(--color-success-bg)';
            } else {
                box.style.borderColor = '';
                box.style.background = '';
            }
            box.hidden = false;
        }
    </script>
</body>

</html>
